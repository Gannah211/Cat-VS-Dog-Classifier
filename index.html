<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat or Dog? 🐾</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffe3ec, #e4d9ff 55%, #d9f1ff);
    font-family: "Nunito", "Segoe UI Rounded", "Trebuchet MS", system-ui, sans-serif; color: #5b4a6b;
  }
  .card {
    width: min(92vw, 420px); background: #fff; border-radius: 28px; padding: 28px 24px 24px;
    box-shadow: 0 18px 50px rgba(150, 110, 200, .25); text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { margin: 0 0 18px; font-size: 14px; color: #9a8aab; }
  .drop {
    border: 3px dashed #d8c5f0; border-radius: 22px; padding: 18px; cursor: pointer;
    background: #fbf7ff; transition: .2s; min-height: 190px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .drop:hover, .drop.over { background: #f3e9ff; border-color: #b895e6; transform: scale(1.015); }
  .drop .big { font-size: 46px; }
  .drop small { color: #a595b8; }
  #preview { max-width: 100%; max-height: 220px; border-radius: 16px; display: none; }
  button {
    margin-top: 16px; width: 100%; padding: 14px; font-size: 17px; font-weight: 700; color: #fff;
    border: 0; border-radius: 16px; cursor: pointer; background: linear-gradient(135deg, #ff8fb1, #b48cff);
    transition: .2s; font-family: inherit;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(180, 140, 255, .45); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #result { display: none; margin-top: 20px; padding: 18px; border-radius: 20px; background: #fff6fa; animation: pop .35s ease; }
  #emoji { font-size: 64px; line-height: 1; }
  #title { font-size: 24px; font-weight: 800; margin: 8px 0 2px; }
  #msg { margin: 0 0 12px; color: #9a8aab; font-size: 14px; }
  .bar { height: 14px; background: #efe6f9; border-radius: 99px; overflow: hidden; }
  #fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ff8fb1, #b48cff); transition: width .7s ease; }
  #pct { margin-top: 6px; font-weight: 700; font-size: 14px; }
  #error { color: #d6456b; font-weight: 700; display: none; margin-top: 14px; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <div class="card">
    <h1>Cat or Dog? 🐾</h1>
    <p class="sub">Drop a photo and I'll guess who it is!</p>

    <div class="drop" id="drop">
      <img id="preview" alt="preview">
      <div id="placeholder">
        <div class="big">🐱 🐶</div>
        <div><b>Click or drag a photo here</b></div>
        <small>JPG or PNG</small>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <button id="btn" disabled>Who is this? 🐾</button>
    <div id="error"></div>

    <div id="result">
      <div id="emoji"></div>
      <div id="title"></div>
      <p id="msg"></p>
      <div class="bar"><div id="fill"></div></div>
      <div id="pct"></div>
    </div>
  </div>

<script>
  const drop = document.getElementById("drop"), fileInput = document.getElementById("file");
  const preview = document.getElementById("preview"), placeholder = document.getElementById("placeholder");
  const btn = document.getElementById("btn"), errorBox = document.getElementById("error");
  const result = document.getElementById("result");
  let selected = null;

  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file || !file.type.startsWith("image/")) { showError("Please choose an image file 🖼️"); return; }
    selected = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
    placeholder.style.display = "none";
    btn.disabled = false;
    errorBox.style.display = "none";
    result.style.display = "none";
  }

  function showError(text) { errorBox.textContent = text; errorBox.style.display = "block"; }

  btn.addEventListener("click", async () => {
    if (!selected) return;
    btn.disabled = true; btn.textContent = "Sniffing... 👃";
    errorBox.style.display = "none";
    const form = new FormData();
    form.append("file", selected);
    try {
      const res = await fetch("/predict", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Something went wrong");
      showResult(data);
    } catch (e) {
      showError(e.message + " 😿");
    } finally {
      btn.disabled = false; btn.textContent = "Who is this? 🐾";
    }
  });

  function showResult(d) {
    const pct = Math.round(d.confidence * 100);
    const unsure = d.confidence < 0.70;
    document.getElementById("emoji").textContent = unsure ? "🤔" : (d.prediction === "cat" ? "🐱" : "🐶");
    document.getElementById("title").textContent =
      unsure ? "Hmm, I'm not sure..." : (d.prediction === "cat" ? "It's a cat!" : "It's a dog!");
    document.getElementById("msg").textContent =
      unsure ? "Maybe try a clearer photo?" : (d.prediction === "cat" ? "Meow~ 🐾" : "Woof woof! 🐾");
    document.getElementById("pct").textContent = pct + "% sure";
    result.style.display = "block";
    const fill = document.getElementById("fill");
    fill.style.width = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = pct + "%"; }));
  }
</script>
</body>
</html>
